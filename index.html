<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fo moods</title>
<style>
:root{--bg:#0b0b0f;--fg:#f3f0ea;--dim:#8a8798;--card:#13131a;--line:#1f1f29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:56px 24px 96px;
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1000px;margin:0 auto 44px}
h1{font-size:30px;font-weight:600;margin:0 0 10px;letter-spacing:-.02em}
p.sub{color:var(--dim);margin:0;font-size:15px;line-height:1.55;max-width:58ch}
main{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px}
.card svg{display:block;width:100%;height:auto}
.name{font-size:17px;font-weight:600;margin:16px 0 3px;letter-spacing:-.01em}
.date{color:var(--dim);font-size:12.5px;margin:0 0 11px}
.note{color:#b8b5c5;font-size:13px;line-height:1.5;margin:0 0 15px}
.axes{display:grid;gap:7px}
.axis{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.axis span{width:62px;flex:none}
.axis .bar{flex:1;height:3px;background:#24242f;border-radius:2px;overflow:hidden}
.axis .bar i{display:block;height:100%;border-radius:2px}
footer{max-width:1000px;margin:64px auto 0;color:var(--dim);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:22px}
code{color:#cfc9e0;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>fo moods</h1>
  <p class="sub">One blob a day. Three axes decide it - energy sets saturation, certainty sets how sharp or soft the edge is, warmth sets the hue. Eyes follow from the mix. No emotion is hand-picked from a list.</p>
</header>
<main id="grid"></main>
<footer>
  Shape, eyes and colour are generated from <code>moods.json</code>. Fo appends one entry a day.
</footer>
<script>
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function blobPath(seed,energy,certainty){
  var rand=rng(seed),n=9,wob=.05+(1-certainty)*.26+energy*.05,pts=[];
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2, r=68*(1+(rand()*2-1)*wob);
    pts.push([100+Math.cos(a)*r,100+Math.sin(a)*r*(.94+energy*.12)]);
  }
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var j=0;j<n;j++){
    var p0=pts[(j-1+n)%n],p1=pts[j],p2=pts[(j+1)%n],p3=pts[(j+2)%n];
    var c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
    var c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+='C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+','+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d+'Z';
}

function eyeStyle(m){
  if(m.certainty<.4) return 'dots';
  if(m.energy>.72) return 'alert';
  if(m.energy<.34) return 'lidded';
  if(m.warmth>.64) return 'squint';
  return 'round';
}

function eyes(style,ink){
  var L=78,R=122,y=96,o='';
  function pair(inner){return inner(L)+inner(R)}
  if(style==='dots') o=pair(function(x){return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+ink+'"/>'});
  else if(style==='round') o=pair(function(x){return '<circle cx="'+x+'" cy="'+y+'" r="8" fill="'+ink+'"/>'});
  else if(style==='alert') o=pair(function(x){return '<ellipse cx="'+x+'" cy="'+y+'" rx="7" ry="12.5" fill="'+ink+'"/>'});
  else if(style==='lidded') o=pair(function(x){return '<path d="M'+(x-9)+' '+y+' q9 6 18 0" stroke="'+ink+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'});
  else o=pair(function(x){return '<path d="M'+(x-9)+' '+(y+3)+' q9 -11 18 0" stroke="'+ink+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'});
  return o;
}

function colors(m){
  var hue=Math.round(202-m.warmth*172),
      sat=Math.round(34+m.energy*54),
      lig=Math.round(52+(1-m.energy)*10);
  return {fill:'hsl('+hue+' '+sat+'% '+lig+'%)',
          glow:'hsl('+hue+' '+sat+'% '+(lig+12)+'%)',
          ink:'hsl('+hue+' 42% 12%)',hue:hue};
}

function card(m,i){
  var c=colors(m),style=eyeStyle(m),blur=((1-m.certainty)*7).toFixed(1),
      id='b'+i,d=blobPath(hash(m.date+m.name),m.energy,m.certainty);
  var svg='<svg viewBox="0 0 200 200" role="img" aria-label="'+m.name+'">'
    +'<defs><filter id="f'+id+'" x="-30%" y="-30%" width="160%" height="160%">'
    +'<feGaussianBlur stdDeviation="'+blur+'"/></filter>'
    +'<radialGradient id="g'+id+'" cx="38%" cy="32%"><stop offset="0%" stop-color="'+c.glow+'"/>'
    +'<stop offset="100%" stop-color="'+c.fill+'"/></radialGradient></defs>'
    +'<path d="'+d+'" fill="url(#g'+id+')" filter="url(#f'+id+')"/>'
    +eyes(style,c.ink)+'</svg>';
  var ax=[['energy',m.energy],['certainty',m.certainty],['warmth',m.warmth]].map(function(a){
    return '<div class="axis"><span>'+a[0]+'</span><div class="bar"><i style="width:'
      +Math.round(a[1]*100)+'%;background:'+c.fill+'"></i></div></div>'}).join('');
  return '<article class="card">'+svg+'<div class="name">'+m.name+'</div>'
    +'<p class="date">'+m.date+' &middot; '+style+' eyes</p>'
    +(m.note?'<p class="note">'+m.note+'</p>':'')+'<div class="axes">'+ax+'</div></article>';
}

fetch('moods.json?'+Date.now()).then(function(r){return r.json()}).then(function(list){
  list.sort(function(a,b){return a.date<b.date?1:-1});
  document.getElementById('grid').innerHTML=list.map(card).join('');
}).catch(function(e){
  document.getElementById('grid').innerHTML='<p class="note">moods.json did not load: '+e+'</p>';
});
</script>
</body>
</html>
